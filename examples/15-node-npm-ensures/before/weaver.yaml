version: "1"
modules:
  - name: "node-base"
    source: "../module"
    ref: "v1"
apps:
  - name: "web"
    module: "node-base"
    path: "services/web"
    inputs: {}
    ensures:
      - type: "ensure.npm.script"
        file: "package.json"
        name: "build"
        value: "tsc -p tsconfig.json"
      - type: "ensure.npm.script"
        file: "package.json"
        name: "lint"
        value: "eslint \"src/**/*.ts\""
      - type: "ensure.npm.script"
        file: "package.json"
        name: "test"
        value: "vitest run"
      - type: "ensure.npm.dep"
        file: "package.json"
        name: "express"
        version: "^4.19.2"
      - type: "ensure.npm.dep"
        file: "package.json"
        name: "zod"
        version: "^3.24.1"
      - type: "ensure.npm.devDep"
        file: "package.json"
        name: "typescript"
        version: "^5.7.3"
      - type: "ensure.npm.devDep"
        file: "package.json"
        name: "eslint"
        version: "^9.18.0"
      - type: "ensure.npm.engine"
        file: "package.json"
        name: "node"
        version: ">=20 <21"
